plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.pythonapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.pythonapp'

        minSdk 24
        targetSdk 35

        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"

        pip {
            install "-r", "requirements.txt"
        }
    }
}

dependencies {
}
