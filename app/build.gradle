plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.pythonapk'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pythonapk'
        minSdk 24
        targetSdk 36

        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"

        pip {
            install "-r", "../requirements.txt"
        }
    }
}
