name: Build Python APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Check build output
        if: always()
        run: |
          echo "===== APK SEARCH ====="
          find . -type f -name "*.apk" -print

          echo "===== BUILD DIRECTORIES ====="
          find . -type d -name build -print

          echo "===== APP OUTPUT ====="
          find app/build -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Python-APK
          path: |
            app/build/outputs/**/*.apk
          if-no-files-found: error
