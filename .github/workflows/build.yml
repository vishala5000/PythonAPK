name: Build Python APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check files
        run: |
          echo "===== FILES ====="
          find . -maxdepth 5 -type f | sort

      - name: Check Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build
        run: |
          ./gradlew :app:assembleDebug --info --stacktrace

      - name: Show APK
        if: always()
        run: |
          echo "===== ALL APK FILES ====="
          find . -type f -name "*.apk" -print

          echo "===== APP BUILD ====="
          find app/build -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Python-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
